<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Productivity Map</title>
<style>
:root{
  --bg:#0b0c0e;
  --surface:#15171a;
  --surface-2:#1b1d21;
  --surface-3:#22252a;
  --text:#f6f6f7;
  --muted:#8e8e93;
  --muted-2:#6e6e73;
  --green:#32d74b;
  --green-soft:rgba(50,215,75,.12);
  --blue:#0a84ff;
  --border:rgba(255,255,255,.085);
  --border-strong:rgba(255,255,255,.14);
  --shadow:0 18px 55px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
button,input,textarea{font:inherit}
#app{
  width:100%;height:100vh;min-height:640px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,255,255,.028), transparent 34%),
    radial-gradient(circle at 50% 100%, rgba(10,132,255,.035), transparent 35%),
    var(--bg);
}
.hidden{display:none!important}

/* top */
.topbar{position:absolute;top:18px;left:18px;right:18px;z-index:20;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.brand,.top-actions{pointer-events:auto}
.brand{
  height:42px;padding:0 14px;border-radius:15px;
  background:rgba(24,26,30,.72);
  border:1px solid var(--border);
  display:flex;align-items:center;gap:9px;
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 6px 24px rgba(0,0,0,.16)
}
.brand-dot{width:10px;height:10px;border-radius:50%;background:var(--green)} .brand b{font-size:14px}
.top-actions{display:flex;gap:8px}
.icon{
  width:42px;height:42px;border-radius:15px;border:1px solid var(--border);
  background:rgba(24,26,30,.72);color:var(--text);display:grid;place-items:center;
  cursor:pointer;font-size:18px;
  backdrop-filter:blur(22px) saturate(140%);
  -webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 6px 24px rgba(0,0,0,.16);
  transition:transform .18s ease, background .18s ease
}
.icon:active{transform:scale(.96)}

/* overview */

/* launch animation: checkmark morphs into plus */
.center-add{
  overflow:hidden;
}
.center-add .launch-icon{
  position:relative;
  width:34px;
  height:34px;
  display:block;
}
.center-add .launch-check,
.center-add .launch-plus-v,
.center-add .launch-plus-h{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:center;
  border-radius:999px;
  background:currentColor;
}
.center-add .launch-check{
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--green);
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  box-shadow:0 0 0 7px rgba(50,215,75,.08);
  animation:launchCheckOut .72s cubic-bezier(.2,.8,.2,1) .42s forwards;
}
.center-add .launch-check:after{
  content:"";
  position:absolute;
  left:50%;
  top:48%;
  width:12px;
  height:6px;
  border-left:3px solid #fff;
  border-bottom:3px solid #fff;
  transform:translate(-50%,-58%) rotate(-45deg);
  border-radius:1px;
}
.center-add .launch-plus-v{
  width:3px;
  height:26px;
  transform:translate(-50%,-50%) scaleY(.2);
  opacity:0;
  animation:launchPlusV .62s cubic-bezier(.2,.8,.2,1) .72s forwards;
}
.center-add .launch-plus-h{
  width:26px;
  height:3px;
  transform:translate(-50%,-50%) scaleX(.2);
  opacity:0;
  animation:launchPlusH .62s cubic-bezier(.2,.8,.2,1) .84s forwards;
}
.center-add.launching{
  animation:centerLaunchPulse 1.15s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes launchCheckOut{
  0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
  48%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.52)}
}
@keyframes launchPlusV{
  0%{opacity:0;transform:translate(-50%,-50%) scaleY(.2)}
  60%{opacity:1;transform:translate(-50%,-50%) scaleY(1.08)}
  100%{opacity:1;transform:translate(-50%,-50%) scaleY(1)}
}
@keyframes launchPlusH{
  0%{opacity:0;transform:translate(-50%,-50%) scaleX(.2)}
  60%{opacity:1;transform:translate(-50%,-50%) scaleX(1.08)}
  100%{opacity:1;transform:translate(-50%,-50%) scaleX(1)}
}
@keyframes centerLaunchPulse{
  0%{transform:translate(-50%,-50%) scale(.86);opacity:0}
  24%{transform:translate(-50%,-50%) scale(1.06);opacity:1}
  48%{transform:translate(-50%,-50%) scale(1)}
  100%{transform:translate(-50%,-50%) scale(1)}
}
@media (prefers-reduced-motion: reduce){
  .center-add.launching,
  .center-add .launch-check,
  .center-add .launch-plus-v,
  .center-add .launch-plus-h{
    animation:none!important
  }
  .center-add .launch-check{opacity:0}
  .center-add .launch-plus-v,
  .center-add .launch-plus-h{opacity:1;transform:translate(-50%,-50%) scale(1)}
}


/* smooth dashboard motion */
.r-node{
  transition:
    left .42s cubic-bezier(.2,.8,.2,1),
    top .42s cubic-bezier(.2,.8,.2,1),
    transform .18s ease,
    border-color .18s ease,
    background .18s ease,
    opacity .28s ease;
}
.r-line{
  transition:
    width .42s cubic-bezier(.2,.8,.2,1),
    transform .42s cubic-bezier(.2,.8,.2,1),
    opacity .28s ease;
}
.r-node.is-entering{
  animation: radialNodeIn .46s cubic-bezier(.2,.8,.2,1) both;
}
.r-line.is-entering{
  animation: radialLineIn .42s ease both;
}
@keyframes radialNodeIn{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.72);
    filter:blur(6px);
  }
  70%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.035);
    filter:blur(0);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:blur(0);
  }
}
@keyframes radialLineIn{
  from{opacity:0}
  to{opacity:1}
}

.sub-list{
  position:relative;
}
.sub{
  transition:
    transform .34s cubic-bezier(.2,.8,.2,1),
    opacity .28s ease,
    margin .34s cubic-bezier(.2,.8,.2,1),
    border-color .16s ease,
    background .16s ease;
}
.sub.is-entering{
  animation: subtaskIn .42s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes subtaskIn{
  0%{
    opacity:0;
    transform:translateY(18px) scale(.985);
  }
  100%{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.add-sub{
  transition:
    transform .34s cubic-bezier(.2,.8,.2,1),
    margin .34s cubic-bezier(.2,.8,.2,1),
    box-shadow .18s ease;
}
.goal-card,
.section-title{
  transition:transform .34s cubic-bezier(.2,.8,.2,1);
}

@media (prefers-reduced-motion: reduce){
  .r-node,.r-line,.sub,.add-sub,.goal-card,.section-title{
    transition:none!important;
    animation:none!important;
  }
}


.radial:before{
  content:"";
  position:absolute;
  left:50%;top:50%;
  width:180px;height:180px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.018),transparent 68%);
  border:1px solid rgba(255,255,255,.028);
  pointer-events:none
}

#overview{position:absolute;inset:0}
.radial{position:absolute;left:50%;top:50%;width:min(760px,92vw);height:min(760px,78vh);transform:translate(-50%,-50%)}
.center-add{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:78px;height:78px;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,#25282d,#1b1d21);
  color:var(--text);font-size:38px;font-weight:200;
  display:grid;place-items:center;cursor:pointer;z-index:6;
  box-shadow:0 18px 50px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.05);
  transition:transform .2s ease, box-shadow .2s ease
}
.center-add:hover{transform:translate(-50%,-50%) scale(1.04)}
.center-add:active{transform:translate(-50%,-50%) scale(.98)}
.r-line{position:absolute;height:1.5px;left:50%;top:50%;transform-origin:0 50%;border-top:2px dashed rgba(255,255,255,.20);z-index:1}
.r-node{
  position:absolute;width:184px;min-height:104px;padding:14px 15px;
  transform:translate(-50%,-50%);
  border-radius:24px;
  background:linear-gradient(180deg,rgba(31,33,38,.97),rgba(24,26,30,.97));
  border:1px solid var(--border);
  cursor:pointer;z-index:5;
  box-shadow:0 12px 34px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025);
  transition:transform .18s ease,border-color .18s ease,background .18s ease
}
.r-node:hover{transform:translate(-50%,-50%) scale(1.02);border-color:var(--border-strong)}
.r-node:active{transform:translate(-50%,-50%) scale(.99)}
.r-node.done{
  background:linear-gradient(180deg,rgba(25,63,33,.78),rgba(20,50,27,.78));
  border-color:rgba(50,215,75,.28)
}
.r-title{
  font-size:15px;font-weight:720;line-height:1.18;padding-right:30px;
  letter-spacing:-.15px;word-break:break-word
}
.r-check{
  position:absolute;right:11px;top:11px;width:24px;height:24px;border-radius:50%;
  border:2px solid #4e5159;background:rgba(0,0,0,.06);color:white;cursor:pointer;padding:0;
  transition:all .18s ease
}
.r-check.done{background:var(--green);border-color:var(--green)} .r-check.done:after{content:"✓";font-size:14px;font-weight:800}
.r-progress{
  margin-top:12px;height:5px;border-radius:99px;background:#2d3035;overflow:hidden
}
.r-progress>i{
  display:block;height:100%;background:linear-gradient(90deg,#28c840,#3fe45a);border-radius:inherit
}
.r-footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px}
.r-percent{font-size:10px;color:var(--muted)}
.r-badge{font-size:9px;padding:3px 6px;border-radius:999px;background:rgba(10,132,255,.14);color:#64aaff;border:1px solid rgba(10,132,255,.22)}
.empty-hint{position:absolute;left:50%;top:calc(50% + 68px);transform:translateX(-50%);color:var(--muted);font-size:14px;white-space:nowrap}


.r-children{
  margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.055);
  display:flex;flex-direction:column;gap:6px
}
.r-child{
  display:flex;align-items:center;gap:7px;min-width:0;color:#a2a3a8;
  font-size:10.5px;line-height:1.15
}
.r-child-dot{width:10px;height:10px;flex:0 0 10px;border-radius:50%;border:1.5px solid #5a5b63}
.r-child.done .r-child-dot{background:var(--green);border-color:var(--green)}
.r-child.done .r-child-dot:after{content:"✓";display:block;color:white;font-size:7px;line-height:8px;text-align:center;font-weight:900}
.r-child-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-more{font-size:9px;color:#6f7076;padding-left:16px}


/* v15 — transparent subtasks, clean list, decorative tail only under + */

/* v16 — precise subtask alignment */
.sub:not(.inline-new){
  display:flex;
  align-items:center;
  min-height:72px;
  padding-top:0 !important;
  padding-bottom:0 !important;
}
.sub:not(.inline-new) .sub-title{
  display:flex;
  align-items:center;
  min-height:30px;
  line-height:1.15;
  margin:0;
}
.sub:not(.inline-new) .sub-meta{
  position:absolute;
  left:58px;
  bottom:8px;
  margin:0;
}

.sub,
.sub.done,
.sub.inline-new{
  background:transparent !important;
  box-shadow:none !important;
  border:none !important;
}

.sub-list{
  position:relative;
}

.sub{
  position:relative;
  z-index:1;
}

.sub-check{
  background:var(--bg) !important;
}
.sub-check.done{
  background:var(--green) !important;
}

/* decorative dashed continuation below the add button */
.add-sub{
  position:relative;
  z-index:2;
}
.tail-dash{
  width:1px;
  height:260px;
  margin:12px auto 0;
  background:repeating-linear-gradient(
    to bottom,
    rgba(142,142,147,.42) 0 6px,
    transparent 6px 13px
  );
  pointer-events:none;
}

/* detail */
#detail{position:absolute;inset:0;overflow-y:auto;padding:88px 18px 120px}
.detail-wrap{width:min(560px,100%);margin:0 auto}
.back{
  position:fixed;left:18px;top:78px;z-index:15;width:42px;height:42px;border-radius:15px;
  border:1px solid var(--border);background:rgba(24,26,30,.78);color:var(--text);cursor:pointer;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 8px 24px rgba(0,0,0,.18)
}
.goal-card{
  position:relative;
  background:linear-gradient(180deg,rgba(31,33,38,.97),rgba(24,26,30,.97));
  border:1px solid var(--border);
  border-radius:32px;
  padding:26px 24px 24px;
  min-height:156px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.025)
}
.goal-card.done{
  background:linear-gradient(180deg,rgba(25,63,33,.78),rgba(20,50,27,.78));
  border-color:rgba(50,215,75,.28)
}
.goal-title{
  font-size:30px;font-weight:780;line-height:1.06;letter-spacing:-.75px;
  padding-left:50px;padding-right:0
}
.goal-check{
  position:absolute;left:22px;top:22px;width:36px;height:36px;border-radius:50%;
  border:2px solid #4e5159;background:rgba(0,0,0,.06);color:white;cursor:pointer;padding:0;
  transition:all .18s ease
}
.goal-check.done{background:var(--green);border-color:var(--green)} .goal-check.done:after{content:"✓";font-size:18px;font-weight:800}
.goal-meta{margin-top:22px;display:flex;align-items:center;gap:10px}.goal-track{height:7px;background:#313238;border-radius:20px;overflow:hidden;flex:1}.goal-track i{display:block;height:100%;background:var(--green);border-radius:inherit}.goal-pct{min-width:38px;text-align:right;color:var(--muted);font-size:12px;font-weight:700}
.ready-note{
  margin-top:15px;padding:11px 13px;border-radius:15px;
  background:rgba(50,215,75,.09);border:1px solid rgba(50,215,75,.16);
  color:#6cdf83;font-size:13px;font-weight:720
}

.section-title{
  margin:32px 6px 13px;color:#8f9096;font-size:12px;font-weight:760;
  text-transform:uppercase;letter-spacing:.13em
}
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub{
  position:relative;border-radius:23px;
  background:linear-gradient(180deg,rgba(26,28,32,.96),rgba(21,23,26,.96));
  border:none;
  padding:16px 58px 16px 58px;
  cursor:pointer;min-height:72px;
  box-shadow:0 8px 24px rgba(0,0,0,.12);
  transition:transform .16s ease,background .16s ease
}
.sub:hover{transform:translateY(-1px)}
.sub:active{transform:translateY(0)}
.sub.done{
  background:linear-gradient(180deg,rgba(22,57,30,.84),rgba(18,45,24,.84));
}
.sub-title{font-size:16px;font-weight:700;line-height:1.22;letter-spacing:-.1px}
.sub-meta{margin-top:7px;font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}
.promoted-pill{padding:3px 7px;border-radius:999px;background:rgba(10,132,255,.12);border:1px solid rgba(10,132,255,.20);color:#64aaff;font-size:10px;font-weight:700}
.sub-actions{
  position:absolute;inset:0;pointer-events:none
}
.promote-btn,.sub-check{
  position:absolute;width:30px;height:30px;border-radius:50%;padding:0;
  display:grid;place-items:center;cursor:pointer;pointer-events:auto
}
.promote-btn{
  right:14px;top:50%;transform:translateY(-50%);
  border:1px solid rgba(255,255,255,.10);background:#292c31;color:#aeb0b8;font-size:15px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03)
}
.promote-btn.active{background:rgba(10,132,255,.16);border-color:rgba(10,132,255,.28);color:#64aaff}
.sub-check{
  left:16px;top:50%;transform:translateY(-50%);
  border:2px solid #505159;background:transparent;color:white
}
.sub-check.done{background:var(--green);border-color:var(--green)} .sub-check.done:after{content:"✓";font-size:15px;font-weight:800}
.detail-empty{color:var(--muted);text-align:center;padding:16px 0 2px;font-size:14px}
.add-sub{
  width:62px;height:62px;margin:26px auto 0;border-radius:50%;
  border:1px solid rgba(255,255,255,.12);
  background:linear-gradient(180deg,#26292e,#1d1f23);
  color:var(--text);font-size:32px;font-weight:200;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 12px 34px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.04);
  transition:transform .18s ease
}
.add-sub:active{transform:scale(.97)}



.sub{cursor:default}
.sub.can-open{cursor:pointer}
.sub.can-open:after{
  content:"";
  position:absolute;
  left:0;top:18px;bottom:18px;
  width:2px;border-radius:2px;
  background:rgba(10,132,255,.55);
}

/* inline subtask creation */
.sub.inline-new{
  padding:12px 16px;
  border:none;
  background:linear-gradient(180deg,rgba(25,30,37,.98),rgba(20,24,29,.98));
  box-shadow:0 8px 24px rgba(0,0,0,.14)
}
.inline-row{
  display:grid;
  grid-template-columns:30px 1fr;
  gap:10px;
  align-items:center;
}
.inline-bullet{
  width:26px;height:26px;border-radius:50%;
  border:2px solid #555961;
}
.inline-input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:16px;
  font-weight:650;
  line-height:1.25;
  padding:7px 0;
}
.inline-input::placeholder{color:#62646a}
.inline-help{
  margin:8px 0 0 40px;
  color:#6f7178;
  font-size:10px;
  line-height:1.35;
}

/* single task modal only for MAIN screen */
.root-modal{
  position:absolute;inset:0;z-index:110;background:rgba(0,0,0,.38);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px
}
.root-dialog{
  width:min(420px,100%);
  background:linear-gradient(180deg,#23262b,#1d1f23);
  border:1px solid var(--border);
  border-radius:28px;padding:22px;
  box-shadow:0 28px 90px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.03)
}
.root-dialog h3{margin:0 0 14px;font-size:21px}
.root-dialog input{
  width:100%;height:52px;border-radius:16px;border:1px solid var(--border);
  background:#17181b;color:var(--text);padding:0 15px;outline:none;font-size:16px
}
.root-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.root-btn{height:42px;border:none;border-radius:14px;padding:0 16px;cursor:pointer;font-weight:700}
.root-cancel{background:#35363c;color:white}
.root-save{background:var(--blue);color:white}

@media(max-width:600px){
  .radial{width:96vw;height:72vh}.r-node{width:158px;min-height:88px;padding:11px 12px}.r-title{font-size:13px}
  .brand b{display:none}.detail-wrap{padding-top:18px}.goal-title{font-size:25px;padding-left:48px}.sub{padding:15px 56px}
  .composer{min-height:55vh;border-radius:24px 24px 0 0}.editor-input{font-size:19px}
}
</style>

<style id="donevo-v20-redesign">
/* =========================================================
   GOALMAP V20 — full visual redesign, same mechanics
   Inspired by airy iOS / Bond-like UI:
   warm white canvas, powder-blue accent, soft grey pills,
   bold typography, almost no borders/shadows.
   ========================================================= */

:root{
  --gm-bg:#f7f7f5;
  --gm-white:#ffffff;
  --gm-grey:#efefed;
  --gm-grey-2:#e7e7e4;
  --gm-grey-3:#d4d4cf;
  --gm-text:#111111;
  --gm-muted:#8f8f89;
  --gm-blue:#73cfff;
  --gm-blue-strong:#33a9ee;
  --gm-blue-soft:#eaf7ff;
  --gm-green:#36cf72;
  --gm-green-soft:#eefaf2;
}

html,body{
  background:var(--gm-bg)!important;
  color:var(--gm-text)!important;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif!important;
}

#app{
  background:
    radial-gradient(circle at 50% 8%, rgba(115,207,255,.10), transparent 22%),
    var(--gm-bg)!important;
}

/* ---------- Top navigation ---------- */

.topbar{
  top:20px!important;
  left:24px!important;
  right:24px!important;
  align-items:center!important;
}

.brand{
  height:auto!important;
  padding:0!important;
  border:0!important;
  background:transparent!important;
  box-shadow:none!important;
  backdrop-filter:none!important;
  -webkit-backdrop-filter:none!important;
  gap:8px!important;
}

.brand-dot{

<script>
(function(){
const KEY="goalmap_radial_v4";

let state=load(),currentId=null,history=[],inlineCreating=false,lastAddedRootId=null,lastAddedSubId=null;
let viewMode=localStorage.getItem("goalmap_view_mode")||"orbit";
let orbitPhase=0,orbitLastTs=0,orbitRAF=0,orbitPaused=false;

function load(){
  try{
    const raw=localStorage.getItem(KEY);

    const p=JSON.parse(raw);
    if(!p||!Array.isArray(p.nodes))return {nodes:[]};
    p.nodes.forEach(n=>{if(typeof n.promoted!=="boolean")n.promoted=false;if(typeof n.archived!=="boolean")n.archived=false});

  }catch(e){return {nodes:[]}}
}
function save(){state.updatedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(state));if(window.gmSync)window.gmSync.touch()}
function uid(){return "n_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function byId(id){return state.nodes.find(n=>n.id===id)}
function children(id){return state.nodes.filter(n=>n.parentId===id)}
function overviewNodes(){return state.nodes.filter(n=>(!n.parentId||n.promoted)&&!n.archived)}
function stats(node){let total=1,done=node.completed?1:0;children(node.id).forEach(c=>{const s=stats(c);total+=s.total;done+=s.done});return {total,done}}
function progress(node){if(node.completed)return 1;const subs=children(node.id);if(!subs.length)return 0;const done=subs.reduce((sum,c)=>{const x=stats(c);return sum+x.done},0);const total=subs.reduce((sum,c)=>{const x=stats(c);return sum+x.total},0);return total?done/total:0}
function allSubtasksReady(node){
  const subs=children(node.id);

}
function addNode(title,parentId){

}
function escapeHTML(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}

    restore:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
    trash:'<path d="M3 6h18"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M19 6l-1 14c-.1 1-1 2-2 2H8c-1 0-1.9-1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>',
    pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
    chevronRight:'<path d="m9 18 6-6-6-6"/>'
  };
  return '<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true">'+(paths[name]||'')+'</svg>';
}



function overviewChildrenHTML(node){

}

function isMobile(){return window.matchMedia("(max-width: 640px)").matches}
function setViewMode(mode){
  viewMode=mode==="list"?"list":"orbit";
  localStorage.setItem("goalmap_view_mode",viewMode);
  renderOverview();
}
function overviewCardHTML(node){

    <button class="r-check ${node.completed?"done":""}">${node.completed?icon("check"):""}</button>

    ${node.completed?'<button class="r-archive" title="В архив" aria-label="В архив">'+icon("archive")+'</button>':""}`;
}
function renderList(){
  const arr=overviewNodes();
  listView.innerHTML="";
  if(!arr.length){
    listView.innerHTML='<div class="detail-empty">Создай большую задачу</div><button class="goal-list-add" aria-label="Добавить задачу"><svg class="lucide" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>';

  }
  arr.forEach(node=>{
    const pct=Math.round(progress(node)*100),subs=children(node.id),visible=subs.slice(0,3);
    const card=document.createElement("div");
    card.className="goal-list-card"+(node.completed?" done":"");
    card.dataset.nodeId=node.id;
    card.innerHTML=`<button class="goal-list-grip" type="button" aria-label="Изменить позицию" title="Перетащить"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="1"/><circle cx="15" cy="7" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/></svg></button><div class="goal-list-top"><button class="goal-list-check ${node.completed?"done":""}">${node.completed?icon("check"):""}</button><div class="goal-list-title">${escapeHTML(node.title)}</div></div>
      ${visible.length?`<div class="goal-list-children">${visible.map(s=>`<div class="goal-list-child ${s.completed?"done":""}"><span class="goal-list-child-dot"></span><span>${escapeHTML(s.title)}</span></div>`).join("")}${subs.length>3?`<div>+ ещё ${subs.length-3}</div>`:""}</div>`:""}
      <div class="goal-list-progress"><i style="width:${pct}%"></i></div>
      <div class="goal-list-foot"><span>${pct}%</span>${node.parentId?'<span class="goal-list-badge">из подзадачи</span>':""}</div>`;
    card.querySelector(".goal-list-check").onclick=e=>{e.stopPropagation();node.completed=!node.completed;save();renderOverview()};
    card.onclick=(e)=>{if(e.target.closest('.goal-list-grip'))return;openDetail(node.id,false)};
    listView.appendChild(card);
  });
  const add=document.createElement("button");add.className="goal-list-add";add.setAttribute("aria-label","Добавить задачу");add.innerHTML='<svg class="lucide" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>';add.onclick=openRootModal;listView.appendChild(add);
}
function physicsCardWidth(count,viewportWidth){
  if(isMobile())return 200;
  return count<=1?310:count===2?286:count===3?258:count<=5?236:218;
}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
const floatNodes=new Map();
let fieldAngle=0,fieldDrag=null,fieldResumeTimer=0;
let layoutShift=0;
function physicsFrame(){
  const r=radial.getBoundingClientRect(),mobile=isMobile();
  return {
    w:r.width,h:r.height,cx:r.width/2,cy:r.height/2,rx:r.left,ry:r.top,
    hx:r.width/2,hy:mobile?addRoot.offsetTop:r.height/2,
    top:mobile?12:70,bottom:mobile?30:34,left:mobile?10:24,right:mobile?10:24,plusR:mobile?52:52
  };
}
function mobileSlots(count,f){
  const cx=f.cx,cy=f.cy;
  const H=f.h, W=f.w;
  if(count<=1)return [{x:cx,y:cy-Math.min(205,H*.24),rot:-.6}];
  if(count===2)return [
    {x:cx,y:cy-Math.min(220,H*.26),rot:-1.0},
    {x:cx,y:cy+Math.min(225,H*.27),rot:.8}
  ];
  if(count===3){
    const dx=Math.min(108,W*.255), up=Math.min(220,H*.26), down=Math.min(205,H*.245);
    return [
      {x:cx,y:cy-up,rot:-.7},
      {x:cx-dx,y:cy+down,rot:1.0},
      {x:cx+dx,y:cy+down,rot:-.9}
    ];
  }
  if(count===4){
    const dx=Math.min(108,W*.255), dy=Math.min(215,H*.255);
    return [
      {x:cx-dx,y:cy-dy,rot:-1.0},
      {x:cx+dx,y:cy-dy,rot:.8},
      {x:cx-dx,y:cy+dy,rot:.7},
      {x:cx+dx,y:cy+dy,rot:-.8}
    ];
  }
  if(count===5){
    const dx=Math.min(106,W*.25);
    const halfH=56,clear=f.plusR+14+halfH;
    const yTop=f.top+halfH,yBot=f.h-f.bottom-halfH;
    const y0=(yTop+Math.max(yTop,cy-clear))/2;
    const y1=cy+clear,y2=Math.max(y1,yBot);
    return [
      {x:cx,y:y0,rot:-.6},
      {x:cx-dx,y:y1,rot:.8},
      {x:cx+dx,y:y1,rot:-.7},
      {x:cx-dx,y:y2,rot:-.8},
      {x:cx+dx,y:y2,rot:.8}
    ];
  }
  // 6+ карточек: две колонки, ряды делятся на «над» и «под» кнопкой +, центр остаётся свободным
  const dx=Math.min(104,W*.245);
  const rows=Math.ceil(count/2);
  const halfH=56,clear=f.plusR+14+halfH;
  const yTop=f.top+halfH,yBot=f.h-f.bottom-halfH;
  const upRows=Math.floor(rows/2),downRows=rows-upRows;
  const line=(from,to,k)=>{
    if(k<=0)return [];
    if(k===1)return [(from+to)/2];
    return Array.from({length:k},(_,i)=>from+(to-from)*i/(k-1));
  };
  const ys=[...line(yTop,Math.max(yTop,f.cy-clear),upRows),...line(f.cy+clear,Math.max(f.cy+clear,yBot),downRows)];
  return Array.from({length:count},(_,i)=>{
    const row=Math.floor(i/2),side=i%2===0?-1:1;
    return {x:f.cx+side*dx,y:ys[row]!==undefined?ys[row]:f.cy,rot:side*(row%2?.7:-.7)};
  });
}
function desktopSlots(count,f){
  if(count<=1)return [{x:f.cx,y:f.cy-205,rot:-.5}];
  const rx=Math.min(330,f.w*.34),ry=Math.min(265,f.h*.31);
  return Array.from({length:count},(_,i)=>{
    const a=-Math.PI/2+i*Math.PI*2/count;
    return {x:f.cx+Math.cos(a)*rx,y:f.cy+Math.sin(a)*ry,rot:Math.sin(a)*1.1};
  });
}
function layoutSlots(count,f){return isMobile()?mobileSlots(count,f):desktopSlots(count,f)}
/* ===== Zero-gravity float engine (v25) =====
   Камера: 1 заметка — крупно, больше заметок — камера отъезжает (масштаб карточек).
   Потянул заметку вверх — она «зависает» крупно в верхней половине, остальные уплывают вниз.
   Карточки не пересекаются (мягкие силы + позиционная коррекция). */
let fieldFrame=null,fieldDirty=true,pressedId=null,focusId=null,grab=null,planBH=130;
const cardEls=new Map(),lineEls=new Map();
const BW=200;
const reduceMotion=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function currentFrame(){if(!fieldFrame||fieldDirty){fieldFrame=physicsFrame();fieldDirty=false}return fieldFrame}
function planRegion(ids,R,plan){
  const M=ids.length,G=10;if(!M)return;
  let best=null;
  for(let cols=(M<=2?1:2);cols<=M;cols++){
    const rows=Math.ceil(M/cols),cw=R.w/cols,ch=R.h/rows;
    const sc=Math.min((cw-G)/BW,(ch-G)/planBH);
    if(!best||sc>best.s+.001)best={cols,rows,cw,ch,s:sc};
  }
  const {cols,rows,cw,ch}=best;
  ids.forEach((id,i)=>{
    const row=Math.floor(i/cols),col=i%cols,rc=row===rows-1?M-row*cols:cols;
    const sc=best.s*.96*(.93+.07*(((i*5)%3)/2));
    const slx=Math.max(0,(cw-BW*sc)/2-2),sly=Math.max(0,(ch-planBH*sc)/2-2);
    const rnd=k=>Math.sin(k*91.7+i*17.3+M*3.1);
    plan.set(id,{
      x:R.x0+(col+.5+(cols-rc)/2)*cw+rnd(1)*slx*.45,
      y:R.y0+(row+.5)*ch+rnd(2)*sly*.45,
      s:Math.max(.3,sc),ax:clamp(slx*.5,3,22),ay:clamp(sly*.5,3,24),rot:rnd(3)*1.6,
      R:{x0:R.x0,y0:R.y0,x1:R.x0+R.w,y1:R.y0+R.h}
    });
  });
}
function ensurePhysicsNodes(dir=0){
  const arr=overviewNodes();
  fieldDirty=true;
  const f=currentFrame();
  if(f.w<10||f.h<10)return;
  const mobile=isMobile(),ids=arr.map(x=>x.id);
  if(focusId&&!ids.includes(focusId))focusId=null;
  const alive=new Set(ids);
  [...floatNodes.keys()].forEach(id=>{if(!alive.has(id))floatNodes.delete(id)});
  cardEls.clear();lineEls.clear();
  const cw=physicsCardWidth(arr.length,f.w);
  arr.forEach(node=>{
    const card=radial.querySelector(`.r-node[data-node-id="${node.id}"]`);
    const line=radial.querySelector(`.r-line[data-node-id="${node.id}"]`);
    if(card){
      cardEls.set(node.id,card);
      card.style.setProperty('width',cw+'px','important');
      card.style.setProperty('min-height',(mobile?124:0)+'px','important');
      card.style.setProperty('left','0','important');card.style.setProperty('top','0','important');
      card.classList.toggle('is-focus',node.id===focusId);
    }
    if(line){lineEls.set(node.id,line);line.style.setProperty('left','0','important');line.style.setProperty('top','0','important')}
  });
  // измерения (один reflow)
  let maxH=0;const dims=new Map();
  arr.forEach(node=>{const c=cardEls.get(node.id);if(!c)return;const w=c.offsetWidth,h=c.offsetHeight;dims.set(node.id,[w,h]);maxH=Math.max(maxH,h)});
  planBH=maxH||130;
  // план раскладки
  const plan=new Map();
  if(mobile){
    const fb=f.hy-f.plusR-12;
    const F={x0:f.left,y0:f.top,w:f.w-f.left-f.right,h:fb-f.top};
    if(focusId&&ids.length>1){
      const mid=f.h*.47;
      planRegion([focusId],{x0:F.x0,y0:F.y0,w:F.w,h:mid-F.y0},plan);
      planRegion(ids.filter(x=>x!==focusId),{x0:F.x0,y0:mid+6,w:F.w,h:fb-mid-6},plan);
    }else planRegion(ids,F,plan);

    p.gy=by+Math.cos(t*.53+p.phase*.89)*ay+Math.sin(t*.29+p.phase*1.47)*ay*.4;
    if(fd){p.gx+=clamp(fieldDrag.dx*.30*p.depth,-40,40);p.gy+=clamp(fieldDrag.dy*.30*p.depth,-40,40)}
  }

  for(let s=0;s<steps;s++){
    for(const o of list){
      const p=o.p,K=p.grab?80:22,C=p.grab?2*Math.sqrt(80)*.9:C0;
      p.fx=(p.gx-p.x)*K-p.vx*C;p.fy=(p.gy-p.y)*K-p.vy*C;
    }

      const a=list[i].p,b=list[j].p;if(!hit(a,b))continue;const dx=b.x-a.x,dy=b.y-a.y;
      const ox=(a.w*a.s+b.w*b.s)/2+16-Math.abs(dx),oy=(a.h*a.s+b.h*b.s)/2+16-Math.abs(dy);

      const a=list[i].p,b=list[j].p;if(!hit(a,b))continue;const dx=b.x-a.x,dy=b.y-a.y;
      const ox=(a.w*a.s+b.w*b.s)/2+10-Math.abs(dx),oy=(a.h*a.s+b.h*b.s)/2+10-Math.abs(dy);

function deleteNodeTree(rootId){
  const removeIds=new Set();
  const collect=(id)=>{
    if(removeIds.has(id)) return;
    removeIds.add(id);
    state.nodes.filter(n=>n.parentId===id).forEach(child=>collect(child.id));
  };
  collect(rootId);
  state.nodes=state.nodes.filter(n=>!removeIds.has(n.id));

  if(target&&target!==listReorder.card){
    const r=target.getBoundingClientRect();const before=e.clientY<r.top+r.height/2;
    target.classList.add(before?'reorder-target-before':'reorder-target-after');
    listReorder.targetId=target.dataset.nodeId;listReorder.before=before;
  }else{listReorder.targetId=null;}
  // autoscroll near viewport edges
  const edge=90;const y=e.clientY; if(y<edge)overview.scrollTop-=10; else if(y>innerHeight-edge)overview.scrollTop+=10;
});
listView.addEventListener('pointerup',e=>{if(listReorder&&e.pointerId===listReorder.pointerId){e.preventDefault();finishListReorder(false)}});
listView.addEventListener('pointercancel',e=>{if(listReorder&&e.pointerId===listReorder.pointerId)finishListReorder(true)});

listBtn.onclick=()=>setViewMode("list");
archiveBtn.onclick=openArchive;
archiveClose.onclick=closeArchive;
archiveModal.onclick=e=>{if(e.target===archiveModal)closeArchive()};
let lastVW=window.innerWidth,lastMob=isMobile();
window.addEventListener("resize",()=>{
  if(overview.classList.contains("hidden"))return;
  const w=window.innerWidth,m=isMobile();
  if(w!==lastVW||m!==lastMob){lastVW=w;lastMob=m;renderOverview()}
  else{fieldDirty=true;if(viewMode==="orbit")ensurePhysicsNodes()}
});
if(window.ResizeObserver){
  new ResizeObserver(()=>{fieldDirty=true;if(viewMode==="orbit"&&!overview.classList.contains("hidden"))ensurePhysicsNodes()}).observe(radial);
}
radial.addEventListener("pointerdown",e=>{const n=e.target.closest&&e.target.closest(".r-node");pressedId=n?n.dataset.nodeId:null},{passive:true});
["pointerup","pointercancel"].forEach(ev=>window.addEventListener(ev,()=>{pressedId=null},{passive:true}));

/* Constellation interaction.
   Cards live in fixed safe slots and only float gently. A swipe on empty space
   rotates the constellation by one slot, so movement stays calm and collision-free. */
let suppressOverviewClickUntil=0;
function freeFieldTarget(target){return !target.closest('.r-node,.center-add,button,.topbar,.goal-list-card')}
function fieldPointerStart(e){
  if(viewMode!=="orbit"||overview.classList.contains('hidden')||!freeFieldTarget(e.target))return;
  fieldDrag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false};
  try{radial.setPointerCapture(e.pointerId)}catch(_){}
}
function fieldPointerMove(e){
  if(!fieldDrag||e.pointerId!==fieldDrag.id)return;
  fieldDrag.dx=e.clientX-fieldDrag.x;fieldDrag.dy=e.clientY-fieldDrag.y;
  if(Math.hypot(fieldDrag.dx,fieldDrag.dy)>10)fieldDrag.moved=true;
  if(fieldDrag.moved)e.preventDefault();
}
function fieldPointerEnd(e){
  if(!fieldDrag||e.pointerId!==fieldDrag.id)return;
  const d=fieldDrag;fieldDrag=null;
  if(!d.moved&&focusId){focusId=null;ensurePhysicsNodes();return}
  const arr=overviewNodes();
  if(d.moved&&arr.length>1&&!isMobile()){
    const horizontal=Math.abs(d.dx)>=Math.abs(d.dy);
    const delta=horizontal?(d.dx<0?1:-1):(d.dy<0?1:-1);
    layoutShift=(layoutShift+delta+arr.length)%arr.length;
    ensurePhysicsNodes(delta);
    suppressOverviewClickUntil=Date.now()+420;
  }
}
radial.addEventListener('pointerdown',fieldPointerStart,{capture:true});
radial.addEventListener('pointermove',fieldPointerMove,{capture:true});
radial.addEventListener('pointerup',fieldPointerEnd,{capture:true});
radial.addEventListener('pointercancel',fieldPointerEnd,{capture:true});
radial.addEventListener('click',e=>{if(Date.now()<suppressOverviewClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);

/* Схватить заметку и потянуть вверх — она увеличивается в верхней половине; вниз — возвращается */
radial.addEventListener("pointerdown",e=>{
  if(!isMobile()||viewMode!=="orbit"||e.target.closest("button,.r-check,.r-archive"))return;
  const c=e.target.closest(".r-node");if(!c)return;
  let id=null;cardEls.forEach((el,k)=>{if(el===c)id=k});
  const p=id!==null&&floatNodes.get(id);if(!p)return;
  const f=currentFrame();
  grab={id,px:e.clientX,py:e.clientY,sx:e.clientX,sy:e.clientY,ox:p.x-(e.clientX-f.rx),oy:p.y-(e.clientY-f.ry),moved:false,dx:0,dy:0,vy:0,lt:performance.now(),ly:e.clientY};
});
window.addEventListener("pointermove",e=>{
  if(!grab)return;
  grab.px=e.clientX;grab.py=e.clientY;grab.dx=e.clientX-grab.sx;grab.dy=e.clientY-grab.sy;
  const now=performance.now(),dt=Math.max(1,now-grab.lt);grab.vy=grab.vy*.6+((e.clientY-grab.ly)/dt)*.4;grab.lt=now;grab.ly=e.clientY;
  const p=floatNodes.get(grab.id);if(!p)return;
  if(!grab.moved&&Math.hypot(grab.dx,grab.dy)>8){
    grab.moved=true;p.grab=true;pressedId=null;
    const el=cardEls.get(grab.id);if(el)el.classList.add("grabbed");
  }
  if(grab.moved)p.lift=grab.dy<-50||(focusId===grab.id&&grab.dy>50);
},{passive:true});
function endGrab(){
  if(!grab)return;
  const g=grab;grab=null;
  const p=floatNodes.get(g.id),el=cardEls.get(g.id);
  if(el)el.classList.remove("grabbed");
  if(p){p.grab=false;p.lift=false}
  if(!g.moved)return;
  suppressOverviewClickUntil=Date.now()+400;
  if(overviewNodes().length>1){
    if(focusId===g.id){if(g.dy>60||g.vy>.6)focusId=null}
    else if(g.dy<-50||g.vy<-.6)focusId=g.id;
  }
  ensurePhysicsNodes();
}
window.addEventListener("pointerup",endGrab);
window.addEventListener("pointercancel",endGrab);

renderOverview();

setTimeout(()=>{
  addRoot.classList.remove("launching");
  launchAnimationFinished=true;
},1500);

/* Мост для блока синхронизации/экспорта (он в отдельном <script> и иначе не видит state) */
window.gmBridge={
  key:KEY,
  get:()=>state,
  set:(n)=>{
    state=n;
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
    if(currentId&&byId(currentId)){renderDetail()}
    else{currentId=null;history.length=0;detail.classList.add("hidden");overview.classList.remove("hidden");renderOverview()}
  }
};

})();
</script>

<style id="gm-sync-css">

.gm-dot.ok{background:#34c759}.gm-dot.warn{background:#ff9f0a}.gm-dot.busy{background:#3aa7f2}
#gmSheet{position:fixed;inset:0;z-index:9999;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

<script>
(function(){
const CID='gm_client_id',TOK='gm_token',FLAG='gm_google',FILE='goalmap.json',SCOPE='https://www.googleapis.com/auth/drive.appdata';
const $=id=>document.getElementById(id);
const S=()=>window.gmBridge.get();
let token=null,exp=0,fileId=null,timer=null,busy=false,status='off',msg='';
const redirect=()=>location.origin+location.pathname;
try{const t=JSON.parse(localStorage.getItem(TOK)||'null');if(t&&t.exp>Date.now()+60000){token=t.t;exp=t.exp}}catch(e){}
// возврат из Google
if(location.hash.length>1){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get('access_token')){token=h.get('access_token');exp=Date.now()+(+h.get('expires_in')||3600)*1000;
    localStorage.setItem(TOK,JSON.stringify({t:token,exp}));localStorage.setItem(FLAG,'1');history.replaceState(null,'',location.pathname+location.search)}
  else if(h.get('error')){sessionStorage.setItem('gm_fail',String(Date.now()));if(h.get('error')!=='login_required'&&h.get('error')!=='interaction_required')msg='Google: '+h.get('error');history.replaceState(null,'',location.pathname+location.search)}
}
const valid=()=>token&&exp>Date.now()+30000;
function login(silent){
  const cid=localStorage.getItem(CID);if(!cid){open();return}
  const u=new URLSearchParams({client_id:cid,redirect_uri:redirect(),response_type:'token',scope:SCOPE,include_granted_scopes:'true',state:String(Date.now())});
  if(silent)u.set('prompt','none');
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+u;
}
function logout(){token=null;exp=0;fileId=null;localStorage.removeItem(TOK);localStorage.removeItem(FLAG);setStatus('off');render()}
async function api(url,opt={}){
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+token}});
  if(r.status===401){token=null;localStorage.removeItem(TOK);throw new Error('auth')}
  if(!r.ok)throw new Error('http '+r.status);return r;
}
async function findFile(){
  const r=await api('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id)&q='+encodeURIComponent("name='"+FILE+"'"));
  const j=await r.json();fileId=j.files&&j.files[0]?j.files[0].id:null;return fileId;
}
async function push(){
  const body=JSON.stringify(S());
  if(!fileId)await findFile();
  if(fileId){await api('https://www.googleapis.com/upload/drive/v3/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});return}
  const b='gm'+Math.random().toString(36).slice(2);
  const mp='--'+b+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:FILE,parents:['appDataFolder']})+'\r\n--'+b+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+b+'--';
  const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:mp});
  fileId=(await r.json()).id;
}
function applyState(n){
  n.nodes.forEach(x=>{if(typeof x.promoted!=='boolean')x.promoted=false;if(typeof x.archived!=='boolean')x.archived=false});
  window.gmBridge.set(n);
}
async function sync(manual){
  if(busy)return;
  if(!valid()){setStatus('warn');if(manual)login(false);return}
  busy=true;setStatus('busy');
  try{
    if(!fileId)await findFile();
    if(!fileId){await push()}
    else{
      const remote=await (await api('https://www.googleapis.com/drive/v3/files/'+fileId+'?alt=media')).json();
      const rt=remote.updatedAt||0,lt=S().updatedAt||0;
      if(!Array.isArray(remote.nodes)){await push()}
      else if(!lt&&S().nodes.length){ // локальные данные ещё не синхронизировались — объединяем
        const ids=new Set(remote.nodes.map(x=>x.id));S().nodes.forEach(x=>{if(!ids.has(x.id))remote.nodes.push(x)});
        remote.updatedAt=Date.now();applyState(remote);await push();
      }
      else if(rt>lt)applyState(remote);
      else if(lt>rt)await push();
    }
    msg='Синхронизировано '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});setStatus('ok');
  }catch(e){msg=e.message==='auth'?'Нужно войти заново':'Ошибка синхронизации ('+e.message+')';setStatus('warn')}
  busy=false;render();
}
function touch(){
  if(!localStorage.getItem(FLAG))return;
  clearTimeout(timer);timer=setTimeout(async()=>{
    if(!valid()){setStatus('warn');return}
    try{setStatus('busy');await push();msg='Синхронизировано '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});setStatus('ok')}
    catch(e){setStatus('warn')}render();
  },1500);
}
// ---- UI
let btn,dot;
function setStatus(st){status=st;if(dot)dot.className='gm-dot '+(st==='ok'?'ok':st==='busy'?'busy':st==='warn'?'warn':'')}
const ICON='<svg class="lucide" viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.78A6 6 0 1 0 5.4 14.6 3.5 3.5 0 0 0 6.5 19z"/></svg>';
function mount(){
  const bar=document.querySelector('.top-actions');if(!bar||btn)return;
  btn=document.createElement('button');btn.className='icon';btn.id='gmBtn';btn.title='Синхронизация';btn.setAttribute('aria-label','Синхронизация');btn.style.position='relative';
  btn.innerHTML=ICON;dot=document.createElement('span');dot.className='gm-dot';btn.appendChild(dot);
  bar.insertBefore(btn,bar.firstChild);btn.onclick=open;
  const sh=document.createElement('div');sh.id='gmSheet';sh.innerHTML='<div class="gm-card" id="gmCard"></div>';document.body.appendChild(sh);
  sh.onclick=e=>{if(e.target===sh)close()};
  setStatus(localStorage.getItem(FLAG)?(valid()?'ok':'warn'):'off');
}
function open(){$('gmSheet').classList.add('open');render()}
function close(){$('gmSheet').classList.remove('open')}
function render(){
  const c=$('gmCard');if(!c)return;
  const cid=localStorage.getItem(CID),on=!!localStorage.getItem(FLAG);
  let h='<h3>Синхронизация</h3><p>Данные хранятся в вашем Google Drive (скрытая папка приложения), доступ к остальным файлам не запрашивается.</p>';
  h+='<div class="gm-st">'+(on?(valid()?'● Подключено. '+msg:'● Нужен вход. '+msg):'○ Не подключено. '+msg)+'</div>';
  if(!cid){
    h+='<p>Origins (без пути):</p><code>'+location.origin+'</code><p>Redirect URI:</p><code>'+redirect()+'</code><input type="text" id="gmCid" placeholder="Client ID: xxxx.apps.googleusercontent.com"><button class="gm-b" id="gmSaveCid">Сохранить Client ID</button>';
  }else if(!on||!valid()){
    h+='<button class="gm-b" id="gmLogin">Войти через Google</button>';
  }else{
    h+='<button class="gm-b" id="gmNow">Синхронизировать сейчас</button><button class="gm-b sec" id="gmOut">Выйти</button>';
  }
  h+='<button class="gm-b sec" id="gmExp">Экспорт в файл</button><button class="gm-b sec" id="gmImp">Импорт из файла</button>';
  if(cid)h+='<button class="gm-b sec" id="gmCidReset" style="font-size:13px">Сменить Client ID</button>';
  h+='<button class="gm-b sec" id="gmClose">Закрыть</button><input type="file" id="gmFile" accept="application/json,.json" style="display:none">';
  c.innerHTML=h;
  const on2=(i,f)=>{const e=$(i);if(e)e.onclick=f};
  on2('gmSaveCid',()=>{const v=$('gmCid').value.trim();if(v){localStorage.setItem(CID,v);render()}});
  on2('gmCidReset',()=>{localStorage.removeItem(CID);logout()});
  on2('gmLogin',()=>login(false));on2('gmNow',()=>sync(true));on2('gmOut',logout);on2('gmClose',close);
  on2('gmExp',exportData);on2('gmImp',()=>$('gmFile').click());
  const f=$('gmFile');if(f)f.onchange=importData;
}
async function exportData(){
  try{
    const name='productivity-map-backup-'+new Date().toISOString().slice(0,10)+'.json';
    const text=JSON.stringify(S(),null,2);
    const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    // На телефоне — системное меню «Поделиться / Сохранить в Файлы»
    if(isMobile&&window.File&&navigator.canShare){
      try{
        const file=new File([text],name,{type:'application/json'});
        if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}
      }catch(e){if(e&&e.name==='AbortError')return}
    }
    // Обычное скачивание (компьютер и запасной вариант)
    const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},4000);
  }catch(err){alert('Не удалось сохранить файл: '+(err&&err.message||err))}
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.nodes))throw 0;
      if(!confirm('Заменить текущие заметки данными из файла ('+d.nodes.length+' шт.)?'))return;
      d.updatedAt=Date.now();applyState(d);if(window.gmSync)gmSync.touch();msg='Импортировано';close();
    }catch(x){alert('Не удалось прочитать файл')}
  };r.readAsText(f);e.target.value='';
}
window.gmSync={touch,sync};
mount();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&localStorage.getItem(FLAG)&&valid())sync(false)});
window.addEventListener('online',()=>{if(valid())sync(false)});
// автозапуск
if(localStorage.getItem(FLAG)&&localStorage.getItem(CID)){
  if(valid())sync(false);
  else{const last=+sessionStorage.getItem('gm_fail')||0;if(Date.now()-last>60000&&!sessionStorage.getItem('gm_try')){sessionStorage.setItem('gm_try','1');login(true)}else setStatus('warn')}
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

 const toast=document.createElement('div');toast.className='gm-toast';document.body.appendChild(toast);

<style id="donevo-mobile-orbit-v10-style">
@media (max-width:600px){
  /* Keep cards comfortably readable; compactness comes from the orbit, not tiny cards. */
  .r-node{width:190px!important;min-height:110px!important;}
  .radial{touch-action:none!important;}
  .r-line{opacity:.42!important;}
}
@media (min-width:420px) and (max-width:440px) and (min-height:880px){
  .r-node{width:194px!important;min-height:112px!important;}
}
</style>

<style id="donevo-v14-center-plus-fix">
@media (max-width:600px){
  /* Keep the create button permanently above orbit cards. */
  .radial .center-add{
    z-index:120!important;
    width:82px!important;
    height:82px!important;
    background:#fff!important;
    box-shadow:0 12px 34px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.04)!important;
    opacity:1!important;
    visibility:visible!important;
    pointer-events:auto!important;
    isolation:isolate;
  }
  .radial .center-add .launch-icon{z-index:2!important;opacity:1!important;}
  .radial .r-node{z-index:5!important;}
  .radial .r-node.dragging{z-index:60!important;}
  .radial .r-line{z-index:1!important;}
}
</style>
<style id="donevo-v15-white-default-cards">
/* DONEVO: white is the default card state; blue is reserved for completion. */
.r-node,
.r-node:hover{
  background:#fff!important;
  border:0!important;
  box-shadow:0 10px 30px rgba(0,0,0,.035)!important;
}
.r-node .r-progress>i{background:#bfc2c5!important;}
.r-node .r-check{background:transparent!important;border-color:#bdbdbd!important;color:transparent!important;}
.r-node.done{background:#fff!important;box-shadow:0 10px 30px rgba(0,0,0,.035)!important;}
.r-node.done .r-progress>i{background:var(--gm-blue-strong)!important;}
.r-node.done .r-check{background:var(--gm-blue-strong)!important;border-color:var(--gm-blue-strong)!important;color:#fff!important;}
.goal-list-card{background:#fff!important;box-shadow:0 8px 24px rgba(0,0,0,.025)!important;}
.goal-list-card .goal-list-progress>i{background:#bfc2c5!important;}
.goal-list-card.done .goal-list-progress>i{background:var(--gm-blue-strong)!important;}
</style>

<style id="donevo-v16-mobile-orbit-polish">
@media (max-width:600px){
  .mobile-orbit .r-node{
    width:216px!important;
    min-height:122px!important;
    border-radius:26px!important;
  }
  .radial .center-add{
    width:84px!important;
    height:84px!important;
    background:var(--gm-blue-strong)!important;
    color:#fff!important;
    box-shadow:0 12px 32px rgba(51,169,238,.22),0 3px 10px rgba(0,0,0,.05)!important;
  }
  .radial .center-add:hover,.radial .center-add:active{background:var(--gm-blue-strong)!important;color:#fff!important;}
  .radial .center-add .launch-plus-v,.radial .center-add .launch-plus-h{background:#fff!important;}
  .mobile-orbit .r-line{opacity:.28!important;}
}
@media (min-width:420px) and (max-width:440px) and (min-height:880px){
  .mobile-orbit .r-node{width:224px!important;min-height:126px!important;}
}
</style>

<style id="donevo-v19-orbit-final">
@media (max-width:600px){
  .mobile-orbit .r-line{
    display:block!important;
    opacity:.34!important;
    border-top:1.5px dashed rgba(17,17,17,.18)!important;
  }
  .mobile-orbit .r-node{
    transition:none!important;
  }
  .radial .center-add{
    width:88px!important;height:88px!important;
    background:var(--gm-blue-strong)!important;color:#fff!important;
  }
}
</style>

<style id="donevo-v23-drift-polish">
.r-node,.r-node:hover,.r-node:active{transition:none!important;}
@media(max-width:600px){
  .mobile-orbit .r-node:active{transform:translate(-50%,-50%) rotate(var(--card-rot,0deg)) scale(1)!important;}
}
</style>
